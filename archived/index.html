<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="'UTF-8'" />
        <title>Script tags - GSAP</title>
        <link rel="stylesheet" href="CSS/styles.css" />
        <style>
            body {
                display:flex;
                align-items: center;
                justify-content: space-around;
                flex-direction: column;
                min-height: 300vh;
                background-color: black;
            }
            h1{color:#fff}
        </style>
    </head>

    <body>
        <h1> This is the first time I am using JS to animation stuff</h1>
        
        <div class="box gradient-green"></div>    
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
        <script src="JS/SplitText.min.js"></script>

        <script>
            // use a script tag or an external JS file
            document.addEventListener("DOMContentLoaded", (event) => {
             gsap.registerPlugin(ScrollTrigger, SplitText)

             let split = new SplitText("h1", {type: "chars"});
             gsap.from(split.chars,{duration:1,yPercent:100,opacity:0,stagger:0.05})
            // gsap code here!
             gsap.to('.box', 
                {
                    rotation:360, 
                    duration:2,
                    scrollTrigger:{
                        trigger:'.box',
                        markers:true,
                        scrub:true,}
                })
            });
           
        </script>
    </body>
</html>
