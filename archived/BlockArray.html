<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="'UTF-8'" />
        <title>Script tags - GSAP</title>
        <link rel="stylesheet" href="CSS/styles.css" />
        <style>
            body {
                display:flex;
                align-items: center;
                justify-content: space-around;
                flex-direction: column;
                min-height: 100vh;
                background-color: black;
            }
            h1{color:#fff}
        </style>
    </head>

    <body>
        
        <div id="container"></div>   
        <script src="JS/gsap.min.js"></script>

        <script>

            //Define the buildGrid Function
            function buildGrid({grid,className,width,gutter,parent,onCellClick}){
                var container = document.querySelector(parent);
                var rows = grid[0];
                var cols = grid[1];
                var total = rows*cols;
                var cellSize = (width - (cols-1)*gutter)/cols;

                for (var i=0; i<total; i++){
                    var cell = document.createElement('div');
                    cell.className = className;
                    cell.style.width = cellSize + 'px';
                    cell.style.height = cellSize + 'px';
                    cell.style.margin = gutter/2 + 'px';
                    cell.addEventListener('click',onCellClick);
                    container.appendChild(cell);
                }
            }

            //Define the onCellClick function
            function onCellClick(){
                console.log('cell clicked!');
            }

            var grid=[5,16],
            tl = gsap.timeline({repeat:-1,repeatDelay:0.5});

            function animateBoxes(from, axis, ease){
                tl.to(".arbox", {
                    duration:1,
                    scale:0.1,
                    y:60,
                    repeat:1,
                    ease:"power1.inOut",
                    stagger:{
                        amount:1.5,
                        grid:grid,
                        axis:axis,
                        ease:none,
                        from:edges,
                    }
                })
            } 

            //Build a grid of <div class="arbox"> elements, dropped into #container
            buildGrid(
                {
                    grid:grid,
                    className:"arbox",
                    width:1200,
                    gutter:16,
                    parent:"#container",
                    onCellClick:onCellClick
                });
            animateBoxes("center",null,null);

        </script>
        <script>
            gsap.to(".arbox", {
                duration:1,
                scale:0.1,
                y:40,
                ease:"power1.inOut",
                stagger:{
                    grid:[5,16],
                    from:"center",
                    amount:1.5,
                    repeat:-1,
                    yoyo:true,
                }
            })
        </script>

    </body>
</html>
