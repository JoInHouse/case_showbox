<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seamless Sine Wave Loop Animation</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #060818;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .viewport {
            width: 48px;
            height: 48px;
            overflow: hidden;
            border: 1px solid rgba(44, 225, 179, 0.3); 
        }
        
        .wave-container {
            width: 76px;
            height: 48px;
            display: block;
        }
        
        .emojiLine {
            stroke: #2CE1B3;
            stroke-linecap: round;
            stroke-width: 1px;
        }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MorphSVGPlugin.min.js"></script>

</head>
<body>
    <div class="viewport">
        <svg class="wave-container" viewBox="0 0 76 48" fill="none">
            <g transform="translate(0, 20.5)">
                <path 
                    class="emojiLine" 
                    d="M0.500244 3.5 
                    C0.500244 3.5 1.32261 0.5 3.46077 0.5 
                    C5.59893 0.5 6.09235 2.07895 6.75024 3.5 
                    C7.40814 4.92105 8.06603 6.5 9.87524 6.5 
                    C11.6845 6.5 12.6036 4.92105 13.0002 3.5 
                    C13.3969 2.07895 14.1516 0.5 15.9608 0.5 
                    C17.77 0.5 18.5923 2.07895 19.2502 3.5 
                    C19.9081 4.92105 20.566 6.5 22.3752 6.5 
                    C24.1845 6.5 24.8423 4.92105 25.5002 3.5 
                    
                    M25.5002 3.5 
                    C25.5002 3.5 26.3226 0.5 28.4608 0.5 
                    C30.5989 0.5 31.0924 2.07895 31.7502 3.5 
                    C32.4081 4.92105 33.066 6.5 34.8752 6.5 
                    C36.6845 6.5 37.6036 4.92105 38.0002 3.5 
                    C38.3969 2.07895 39.1516 0.5 40.9608 0.5 
                    C42.77 0.5 43.5923 2.07895 44.2502 3.5 
                    C44.9081 4.92105 45.566 6.5 47.3752 6.5 
                    C49.1845 6.5 49.8423 4.92105 50.5002 3.5 

                    M50.5002 3.5
                    C50.5002 3.5 51.3226 0.5 53.4608 0.5
                    C55.5989 0.5 56.0924 2.07895 56.7502 3.5
                    C57.4081 4.92105 58.066 6.5 59.8752 6.5
                    C61.6845 6.5 62.6036 4.92105 63.0002 3.5
                    C63.3969 2.07895 64.1516 0.5 65.9608 0.5
                    C67.77 0.5 68.5923 2.07895 69.2502 3.5
                    C69.9081 4.92105 70.566 6.5 72.3752 6.5
                    C74.1845 6.5 74.8423 4.92105 75.5002 3.5" 
                />
            </g>
        </svg>
    </div>

    <script>
        gsap.registerPlugin(MorphSVGPlugin);
        const repeatingUnitWidth = 25.0; 
        gsap.to(".wave-container", {
            x: -repeatingUnitWidth,
            duration: 1, 
            ease: "linear", 
            repeat: -1
        });
    </script>    
</body>
</html>
