    <style>

            background: #040822;
            display: flex;

            align-items: center;

            overflow-x: auto;
        }
        
        svg {
            max-width: 100%;
            height: auto;
        }

        .flow-line, .r-flow-line {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.9;
        }

        .basepath{
            stroke-width:1px;
            stroke-opacity: 1;
            stroke:#181E50;
            fill: none;
        }
    </style>
