<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="'UTF-8'" />
        <title>GSAP Practising</title>
        <link rel="stylesheet" href="CSS/styles.css" />
        <style>
            body {
                display:flex;
                align-items: center;
                justify-content: space-around;
                flex-direction: column;
                min-height: 100vh;
                background-color: black;
            }

        </style>
    </head>

    <body>

        <div class="section">
            <div class="box gradient-green"></div>
            <div class="box gradient-pink"></div>
            <div class="box gradient-orange"></div>
            <div class="box gradient-purple"></div>
            <div class="box gradient-blue"></div>
        </div>

        
        <script src="JS/gsap.min.js"></script>
        
        <script>
            gsap.to(".box",{
                duration:1,
                rotation:360,
                opacity:1,
                delay:0.5,
                stagger:0.2,
                repeat:2,
                ease:"sine.out"
            })
        </script>
        
        <script>
            document.querySelectorAll(".box").forEach(
                function(box)
                {box.addEventListener("click",function(){
                    gsap.to(".box",{
                        duration:0.5,
                        opacity:0,
                        y:-200,
                        stagger:0.1,
                        ease:"back.in"
                    })
                })

            })
        </script>


    </body>
</html>
