<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Path Growth</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #040822;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: auto;
        }
        
        svg {
            max-width: 100%;
            height: auto;
        }

        .base-path {
            stroke: #3C3F58;
            stroke-width: 1px;
        }

        /* Glowing splines that move along paths */
        .glow-spline {
            fill: none;
            stroke-dasharray: 2000 2000;
            stroke-linecap: round;
            stroke-dashoffset: 2000;
            animation: moveSpline 4s ease-in-out infinite;
        }
        
        .glow-spline.reversed {
            stroke-dashoffset: -2000;
            animation: moveSpline 10s ease-out infinite;
        }

  /* Different colors for splines */        
        .spline-1 { stroke: url(#spline-gradient-1); stroke-width: 3px;filter: url(#glow-1);}
        .spline-2 { stroke: url(#spline-gradient-2); stroke-width: 1px;filter: url(#glow-2);}
        .spline-3 { stroke: url(#spline-gradient-3); stroke-width: 2px;filter: url(#glow-3);}
        .spline-4 { stroke: url(#spline-gradient-4); stroke-width: 2px;filter: url(#glow-4);}
        .spline-5 { stroke: url(#spline-gradient-5); stroke-width: 3px;filter: url(#glow-5);}
        .spline-6 { stroke: url(#spline-gradient-6); stroke-width: 3px;filter: url(#glow-6);}
        .spline-7 { stroke: url(#spline-gradient-7); stroke-width: 2px;filter: url(#glow-7);}
        .spline-8 { stroke: url(#spline-gradient-8); stroke-width: 3px;filter: url(#glow-8);}
        .spline-9 { stroke: url(#spline-gradient-9); stroke-width: 4px;filter: url(#glow-9);}
        .spline-10 { stroke: url(#spline-gradient-10); stroke-width: 1px;filter: url(#glow-10);}

        .spline-11 { stroke: url(#spline-gradient-11); stroke-width: 2px;filter: url(#glow-10);}

        @keyframes moveSpline {
            0% {
                stroke-dashoffset: 2000;
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                stroke-dashoffset: -1200;
                opacity: 0;
            }
        }

        /* Stagger the spline animations */
        .spline-1 { animation-delay: 0.5s; }
        .spline-2 { animation-delay: 1s; }
        .spline-3 { animation-delay: 1.5s; }
        .spline-4 { animation-delay: 2s; }
        .spline-5 { animation-delay: 2.5s; }
        .spline-6 { animation-delay: 3s; }
        .spline-7 { animation-delay: 3.5s; }
        .spline-8 { animation-delay: 4s; }
        .spline-9 { animation-delay: 4.5s; }
        .spline-10 { animation-delay: 5s; }
        
        .delay-0 { animation-delay: 0.4s; }
        .delay-1 { animation-delay: 0.8s; }
        .delay-2 { animation-delay: 1.2s; }


        /* Enhanced glow effects */
        .enhanced-glow {
            filter: 
                drop-shadow(0 0 4px currentColor) 
                drop-shadow(0 0 8px currentColor) 
                drop-shadow(0 0 16px currentColor) 
                drop-shadow(0 0 32px currentColor);
        }
    </style>
</head>
