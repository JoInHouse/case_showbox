    <script>
        // GSAP Animation using DrawSVG plugin fallback with stroke-dasharray
        document.addEventListener('DOMContentLoaded', function() {
            
            const flowLines = document.querySelectorAll('.flow-line');

            // Seeded random number generator
            //const seededRandom = (seed) => {
            //    const x = Math.sin(seed) * 10000;
            //    return x - Math.floor(x);
            //};
            
            flowLines.forEach((line, index) => {
                const length = line.getTotalLength();
                const speed = parseFloat(line.dataset.speed) || 3;
                const strokeWidth = parseFloat(line.dataset.width) || 2;

                //random patterns:
                const createVariedPattern = () => {
                    const segments = [];
                    let totalLength = 0;
                    
                    while (totalLength < length * 2) {
                        const visible = length * (0.5 + Math.random() * 0.5);
                        const gap = length * (0.01 + Math.random() * 0.05);
                        segments.push(visible, gap);
                        totalLength += visible + gap;
                    }
                    
                    return segments.join(' ');
                };
                
                // Set initial styles
                line.style.strokeWidth = strokeWidth + 'px';
                //line.style.strokeDasharray = `${length * 0.9} ${length * 0.1}`; // 30% gap, 70% visible
                line.style.strokeDasharray = createVariedPattern();
                line.style.strokeDashoffset = length;
                
                // Create smooth continuous flow animation
                gsap.to(line, {
                    strokeDashoffset: -length * 2,
                    duration: speed,
                    ease:  "none",  // Linear movement for constant speed
                    repeat: -1
                });
                
                // Add slight pulsing to stroke width for organic feel
                gsap.to(line, {
                    strokeWidth: strokeWidth * 1.5,
                    duration: speed / 2,
                    repeat: -1,
                    yoyo: true,
                    ease: "sine.inOut",
                    delay: index * 0.2
                });
                
                // Add subtle opacity variation
                gsap.to(line, {
                    opacity: 0.3,
                    duration: speed / 2,
                    repeat: -1,
                    yoyo: true,
                    ease: "sine.inOut",
                    delay: index * 0.15
                });
            });
            
            // Alternative: Create particle-like segments flowing
            function createFlowingSegments() {
                flowLines.forEach((line, lineIndex) => {
                    const length = line.getTotalLength();
                    const speed = parseFloat(line.dataset.speed) || 3;
                    
                    // Create multiple segment animations
                    for (let i = 0; i < 5; i++) {
                        const segment = line.cloneNode();
                        line.parentNode.appendChild(segment);
                        
                        // Each segment is a portion of the line
                        const segmentLength = length * 0.05; // 15% of total length
                        segment.style.strokeDasharray = `${segmentLength} ${length}`;
                        segment.style.opacity = 0;
                        
                        // Animate each segment with offset timing
                        gsap.timeline({ repeat: -1, delay: i * (speed / 2) })
                            .set(segment, { 
                                strokeDashoffset: length + segmentLength,
                                opacity: 0 
                            })
                            .to(segment, {
                                strokeDashoffset: -segmentLength,
                                opacity: 1,
                                duration: speed * 0.1,
                                ease: "power2.in"
                            })
                            .to(segment, {
                                strokeDashoffset: -length,
                                opacity: 1,
                                duration: speed * 0.8,
                                ease: "none"
                            })
                            .to(segment, {
                                strokeDashoffset: -length - segmentLength,
                                opacity: 0,
                                duration: speed * 0.1,
                                ease: "power2.out"
                            });
                    }
                });
            }
            
            
            // Add glow intensity variation
            const glowFilter = document.querySelector('#glow feGaussianBlur');
            if (glowFilter) {
                gsap.to(glowFilter, {
                    attr: { stdDeviation: 6 },
                    duration: 2,
                    repeat: -1,
                    yoyo: true,
                    ease: "sine.inOut"
                });
            }
        });
    </script>
