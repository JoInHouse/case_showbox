<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PreloaderAssets_UseCases</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --text-dark: #06001A;
      --text-mid: #797990;
      --text-link: #0876F5;
      --brand-blue: #6271EB;
      --border-grey: #A5B3CD;
      --border-light: #EEF1F6;
      --border-purple: #DFDBEF;
      --gray-dark: #4A526B;
      --gray-cool: #A6A8BD;
      --pale-ice: #EFEFFB;
      --shadow: 0 2px 6px 2px rgba(170,173,209,0.15), 0 1px 2px 0 rgba(170,173,209,0.30);
    }

    body {
      font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F0F2F8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 20px;
    }

    /* ── Dashboard wrapper ── */
    .dashboard-body {
      width: 1176px;
      background: #fff;
      position: relative;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      overflow: visible;
    }

    /* ── Close button ── */
    .close-btn {
      position: absolute;
      top: 13px;
      right: 15px;
      width: 14px;
      height: 14px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gray-dark);
      z-index: 10;
    }

    /* ── Tab navigation ── */
    .tab-nav {
      display: flex;
      align-items: flex-end;
      padding: 20px 20px 0;
    }

    .tab-list {
      display: flex;
      align-items: flex-end;
      gap: 24px;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .tab-inner {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-bottom: 6px;
    }

    .tab-text {
      font-size: 13px;
      color: var(--text-mid);
      white-space: nowrap;
      line-height: 18px;
    }

    .tab-item.active .tab-text {
      color: var(--text-dark);
      font-weight: 500;
    }

    .tab-underline {
      height: 2px;
      width: 100%;
      border-radius: 1px;
    }

    .tab-item.active .tab-underline {
      background: var(--text-link);
    }

    .tab-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 4px;
      /* leave room for close btn */
      padding-right: 28px;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 26px;
      padding: 0 8px;
      border: 1px solid var(--border-grey);
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text-dark);
      background: #fff;
      cursor: pointer;
    }

    .icon-btn.icon-only { width: 30px; padding: 0; }

    /* ── Results / search row ── */
    .results-row {
      display: flex;
      align-items: center;
      padding: 0 20px;
      height: 55px;
      border-top: 1px solid var(--border-light);
      gap: 16px;
    }

    .results-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .preloader{
      display: flex;
      align-items: center;
    }

    .results-label {
      font-size: 12px;
      white-space: nowrap;
      background: linear-gradient(90deg, var(--gray-cool) 0%, var(--gray-dark) 40%, var(--gray-cool) 80%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer-text 1.5s linear infinite;
    }

    @keyframes shimmer-text {
      0%   { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .results-entity {
      font-size: 14px;
      font-weight: 400;
      color: var(--brand-blue);
      letter-spacing: -0.3px;
      line-height: 35px;
    }

    .search-area {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .search-input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border-grey);
      border-radius: 4px;
      padding: 0 10px;
      height: 34px;
      width: 240px;
      background: #fff;
    }

    .search-input-wrap input {
      border: none;
      outline: none;
      font-size: 13px;
      color: var(--text-dark);
      font-family: inherit;
      width: 100%;
      background: transparent;
    }

    .search-input-wrap input::placeholder { color: var(--text-mid); }

    .search-btn {
      height: 34px;
      padding: 0 16px;
      background: var(--brand-blue);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
    }

    .home-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border-light);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: #fff;
      margin-left: 2px;
    }

    .search-divider {
      width: 1px;
      height: 33px;
      background: var(--border-light);
      flex-shrink: 0;
    }

    /* ── Sections container ── */
    .sections-container {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── Section header ── */
    .section-header {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dark);
      margin-left: 2px;
    }

    /* ── Summary card ── */
    .summary-card {
      border: 1px solid var(--border-light);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .summary-inner {
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 24px;
    }

    .info-col { display: flex; flex-direction: column; }

    .info-row {
      display: flex;
      align-items: flex-start;
      min-height: 28px;
      padding: 0 0 0 0;
    }

    .info-label {
      font-size: 13px;
      color: var(--text-mid);
      width: 116px;
      flex-shrink: 0;
      padding-top: 1px;
      line-height: 28px;
    }

    .info-value {
      font-size: 13px;
      color: var(--text-dark);
      font-weight: 500;
      line-height: 28px;
      flex: 1;
    }

    /* ── Command label badge ── */
    .cmd-label {
      display: inline-flex;
      align-items: center;
      background: var(--pale-ice);
      border: 1px solid var(--border-purple);
      border-radius: 3px;
      padding: 0 4px;
      font-size: 12px;
      color: var(--text-link);
      cursor: pointer;
      height: 16px;
      margin-top: 6px;
    }

    /* ── Show metrics button ── */
    .show-metrics-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--border-grey);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 12px;
      font-family: inherit;
      color: var(--text-dark);
      cursor: pointer;
      background: #fff;
      margin-top: 8px;
    }

    /* ── Related CIs ── */
    .related-cis-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .related-cis-header .section-header { margin-bottom: 0; }

    .group-filter-label {
      font-size: 12px;
      color: var(--text-mid);
      margin-left: 4px;
    }

    .filter-dropdown {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 23px;
      padding: 0 8px;
      border: 1px solid var(--border-grey);
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
      color: var(--text-dark);
      background: #fff;
      cursor: pointer;
    }

    /* ── CI cards area ── */
    .ci-cards-area {
      position: relative;
    }

    .ci-cards-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin: 0 12px;
    }

    .ci-card {
      border: 1px solid var(--border-light);
      border-radius: 8px;
      background: #fff;
      padding: 16px;
      position: relative;
      min-height: 380px;
    }

    /* "+CI" controls badge */
    .ci-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      border: 1px solid var(--border-grey);
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 11px;
      color: var(--gray-dark);
      margin-bottom: 12px;
      height: 20px;
    }

    .ci-badge-plus {
      font-size: 13px;
      line-height: 1;
    }

    .ci-info-row {
      display: flex;
      align-items: flex-start;
      min-height: 28px;
      font-size: 12px;
    }

    .ci-label {
      color: var(--text-mid);
      width: 90px;
      flex-shrink: 0;
      line-height: 28px;
    }

    .ci-value {
      color: var(--text-dark);
      font-weight: 500;
      line-height: 28px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 128px;
    }

    .ci-value.link { color: var(--text-link); }

    .ci-full-details {
      position: absolute;
      bottom: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-mid);
      cursor: pointer;
      text-decoration: none;
    }

    .ci-full-details:hover { color: var(--text-link); }

    /* ── Carousel arrows ── */
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
    }

    .carousel-arrow.left  { left: -12px; }
    .carousel-arrow.right { right: -12px; }

    /* ── Pagination dots ── */
    .pagination-dots {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 12px;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gray-cool);
    }

    .dot.active { background: var(--brand-blue); }
  </style>
</head>
<body>
<div class="dashboard-body">

  <!-- ── Close button ── -->
  <button class="close-btn" aria-label="Close">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M1.5 1.5L12.5 12.5M12.5 1.5L1.5 12.5" stroke="#4A526B" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- ── Tab navigation ── -->
  <nav class="tab-nav">
    <div class="tab-list">

      <!-- Incident -->
      <div class="tab-item">
        <div class="tab-inner">
          <img src="../img/Controls/Tickets.svg" width="14" height="14" alt="">
          <span class="tab-text">Incident</span>
        </div>
        <div class="tab-underline"></div>
      </div>

      <!-- IP Address & device -->
      <div class="tab-item">
        <div class="tab-inner">
          <img src="../img/Controls/IPAddress.svg" width="14" height="14" alt="">
          <span class="tab-text">IP Address &amp; device</span>
        </div>
        <div class="tab-underline"></div>
      </div>

      <!-- Server & Application (active) -->
      <div class="tab-item active">
        <div class="tab-inner">
          <img src="../img/Controls/Server.svg" width="14" height="14" alt="">
          <span class="tab-text">Server &amp; Application</span>
        </div>
        <div class="tab-underline"></div>
      </div>

      <!-- Jira issue -->
      <div class="tab-item">
        <div class="tab-inner">
          <img src="../img/Controls/Jira.svg" width="12" height="12" alt="">
          <span class="tab-text">Jira issue</span>
        </div>
        <div class="tab-underline"></div>
      </div>

    </div>

    <div class="tab-actions">
      <!-- Refresh -->
      <button class="icon-btn icon-only" title="Refresh">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M2.5 7a4.5 4.5 0 1 0 1.08-2.88" stroke="#4A526B" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M2.5 3.5V7H6" stroke="#4A526B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <!-- Share -->
      <button class="icon-btn">
        <img src="../img/Controls/Share.svg" width="14" height="14" alt="">
        Share
      </button>
    </div>
  </nav>

  <!-- ── Results / search row ── -->
  <div class="results-row">
    <div class="results-left">
      <span class="preloader">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" overflow="visible">
          <!-- col x=2 — leftmost, origin between y=6 and y=10 -->
          <circle cx="2"  cy="2"  r="1" fill="#4A526B"><animate attributeName="r" values="1;2;1" dur="1.2s" repeatCount="indefinite" begin="0.27s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/></circle>

          <circle cx="6"  cy="10" r="1" fill="#4A526B"><animate attributeName="r" values="1;2;1" dur="1.2s" repeatCount="indefinite" begin="0.20s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/></circle>

          <!-- col x=10 -->
          <circle cx="10" cy="2"  r="1" fill="#4A526B"><animate attributeName="r" values="1;2;1" dur="1.2s" repeatCount="indefinite" begin="0.45s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/></circle>
          <circle cx="10" cy="6"  r="1" fill="#4A526B"><animate attributeName="r" values="1;2;1" dur="1.2s" repeatCount="indefinite" begin="0.37s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/></circle>

          <!-- col x=14 — farthest -->
          <circle cx="14" cy="2"  r="1" fill="#4A526B"><animate attributeName="r" values="1;2;1" dur="1.2s" repeatCount="indefinite" begin="0.60s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/></circle>
          <circle cx="14" cy="6"  r="1" fill="#4A526B"><animate attributeName="r" values="1;2;1" dur="1.2s" repeatCount="indefinite" begin="0.54s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/></circle>
          <circle cx="14" cy="10" r="1" fill="#4A526B"><animate attributeName="r" values="1;2;1" dur="1.2s" repeatCount="indefinite" begin="0.54s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/></circle>
          <circle cx="14" cy="14" r="1" fill="#4A526B"><animate attributeName="r" values="1;2;1" dur="1.2s" repeatCount="indefinite" begin="0.60s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/></circle>
        </svg>
      </span>
      <span class="results-label">Searching...</span>
    </div>
    <div class="search-area">
      <div class="search-input-wrap">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="6" cy="6" r="4" stroke="#A6A8BD" stroke-width="1.2"/>
          <path d="M9.2 9.2L12 12" stroke="#A6A8BD" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <input type="text" placeholder="Input server or application">
      </div>
      <button class="search-btn">Search</button>
      <div class="search-divider"></div>
      <button class="home-btn" title="Home">
        <img src="../img/Controls/Home.svg" width="14" height="14" alt="">
      </button>
    </div>
  </div>

  <!-- ── Results / search row (when time over 10s) ── -->
  <div class="results-row">
    <div class="results-left">
      <span class="preloader">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" overflow="visible">

          <!-- col x=6 -->
          <circle cx="6"  cy="2"  r="1" fill="#4A526B"><animate attributeName="r" values="1;2;1" dur="1.2s" repeatCount="indefinite" begin="0.32s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/></circle>

          <circle cx="6"  cy="14" r="1" fill="#4A526B"><animate attributeName="r" values="1;2;1" dur="1.2s" repeatCount="indefinite" begin="0.32s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/></circle>
          <!-- col x=10 -->
