<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="utf-8">
  <title>Showcase · DevAI NEO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #040822;
      color: #c8cce6;
      font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 64px;
      gap: 48px;
      -webkit-font-smoothing: antialiased;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #e4e8ff;
      letter-spacing: -0.02em;
      text-align: center;
    }
    h1 span {
      color: #6271eb;
    }

    .viewport-row {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .viewport {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .viewport-frame {
      width: 760px;
      height: 680px;
      border: 1px solid #1a2155;
      border-radius: 10px;
      overflow: hidden;
      background: #0c1130;
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(98, 113, 235, 0.08);
    }

    .viewport-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .footer-note {
      font-size: 12px;
      color: #4a5078;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>DevAI <span>NEO</span> · Animation Showcase</h1>

  <div class="viewport-row">
    <div class="viewport">
      <div class="viewport-frame">
        <iframe src="IncidentLandscape.html" title="Incident Landscape"></iframe>
      </div>
    </div>
  </div>

  <div class="viewport-row">
    <div class="viewport">
      <div class="viewport-frame">
        <iframe src="Trends.html" title="Trends"></iframe>
      </div>
    </div>
  </div>

  <p class="footer-note">Each page auto-scrolls to follow content as it populates. Open individually for full-page view.</p>

</body></html>
