<!DOCTYPE html>
<!--

  Figma: DevAI_Site › GetYourDataTruthScore (node 9796:4992)
  Plan:  Guide/DevAI Campaign Page — Implementation Plan for Claude Code.md

  Effect: a dark, sticky hero plays a scripted search (GSAP timeline), then
  alert chips highlight the tool tiles that cause each problem. Scrolling
  slides a white content sheet over the receding hero; the docked header
  flips to its light style as the sheet reaches it.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevAI — Get Your IT Data Truth Score</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400&family=Lato:wght@400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       Tokens — every value from the Figma frame, named by role.
       ============================================================ */
    :root {
      /* Surfaces */
      --color-bg-hero:            #040822;               /* Blue_Dark */
      --color-bg-content:         #ffffff;
      --color-bg-footer:          #040822;
      --color-surface-overlay:    rgba(0, 0, 0, 0.2);    /* Overlays/Default — nav pill, search, chips */
      --color-surface-tile:       rgba(4, 8, 34, 0.6);
      --color-surface-tile-lift:  rgba(18, 32, 58, 0.92);
      --color-surface-input:      #fafbff;               /* Neutrals/BG */
      --color-surface-searchbox:  #ffffff;
      --color-surface-card:       #ebeffb;               /* deliverable cards */
      --color-surface-form:       #ffffff;
      --color-surface-security:   #1a875b;

      /* Text */
      --color-text-hero-heading:  #c6cce2;
      --color-text-hero-body:     #e2e2e2;
      --color-text-on-dark:       #ffffff;
      --color-text-tile-title:    #b4b4b4;
      --color-text-label:         #797990;               /* neo-fg-3 */
      --color-text-heading:       #191919;               /* NeualGrey-30 */
      --color-text-body:          #040822;
      --color-text-form:          #06001a;               /* Text/Dark */
      --color-text-placeholder:   #b4b4b4;
      --color-text-input:         #000000;               /* Labels/Primary */
      --color-text-footer:        #707793;               /* Grey - 10 */
      --color-text-on-accent:     #0d1336;
      --color-text-required:      #ec2138;

      /* Accents & status */
      --color-accent-green:       #41ea97;               /* CTA pill */
      --color-accent-green-hover: #2fdc87;
      --color-accent-teal:        #32c7a9;               /* chip border, logo dots */
      --color-accent-indigo:      #6271eb;               /* Brand/Indigo500 — search button */
      --color-accent-indigo-down: #4c5bd4;
      --color-alert:              #e67e27;               /* mismatching values */
      --color-danger:             #d40000;               /* "Not found" */
      --color-warning-icon:       #ff9500;               /* Colors/Orange */

      /* Borders */
      --color-border-nav:         #3c3f58;               /* Grey-30 */
      --color-border-nav-divider: #4a4a4a;
      --color-border-search:      #8e8e93;               /* Grays/Gray */
      --color-border-searchbox:   #a5b3cd;               /* Border/Grey-NoActive */
      --color-border-tile:        #3e4944;
      --color-border-light:       #dfdbef;               /* Border/LightPurple */

      /* Gradients */
      --gradient-heading: linear-gradient(-90deg,
        #41b7a9 24.576%, #4f83ab 39.831%, #353a7c 60.169%, #040822 75.424%);
      --gradient-how-card: url("data:image/svg+xml;utf8,<svg viewBox='0 0 1360 456' xmlns='http://www.w3.org/2000/svg' preserveAspectRatio='none'><rect x='0' y='0' height='100%' width='100%' fill='url(%23grad)' opacity='1'/><defs><radialGradient id='grad' gradientUnits='userSpaceOnUse' cx='0' cy='0' r='10' gradientTransform='matrix(-5.0829e-7 66.247 -405.55 101.81 680 20.267)'><stop stop-color='rgba(65,183,169,0.2)' offset='0'/><stop stop-color='rgba(79,131,171,0.2)' offset='0.3'/><stop stop-color='rgba(53,58,124,0.2)' offset='0.7'/><stop stop-color='rgba(4,8,34,0.2)' offset='1'/></radialGradient></defs></svg>");
      --gradient-footer-rule: linear-gradient(90deg,
        rgba(58, 58, 58, 0) 0%, #b4b4b4 50%, rgba(58, 58, 58, 0) 100%);

      /* Type */
      --font-sans: 'Source Sans 3', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-nav:  'Lato', 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Google Sans Code', ui-monospace, 'SF Mono', Menlo, monospace;
      --text-display: clamp(40px, 3.2vw + 18px, 64px);
      --text-h3:      28px;
      --text-lead:    20px;
      --text-title:   20px;
      --text-nav:     18px;
      --text-body:    16px;
      --text-form:    14.4px;
      --text-sm:      14px;
      --text-xs:      12px;
      --lh-display:   72px;
      --lh-lead:      32px;

      /* Radii */
      --radius-nav:    16px;
      --radius-search: 8px;
      --radius-button: 4px;
      --radius-tile:   8px;
      --radius-card:   8px;
      --radius-cta:    24px;
      --radius-pill:   99px;
      --radius-sheet:  16px;

      /* Layout & spacing */
      --page-max:        1440px;
      --page-gutter:     40px;
      --hero-max:        1200px;
      --search-w:        640px;
      --hero-copy-w:     880px;
      --form-w:          480px;
      --header-pad:      40px;
      --nav-h:           54px;

      /* Elevation */
      --shadow-search: 0 1px 1px rgba(98, 113, 235, 0.35), 0 2px 3px rgba(98, 113, 235, 0.02);
      --shadow-sheet-edge: 0 -24px 48px rgba(0, 0, 0, 0.35);

      /* Motion: CSS durations multiply by --motion-scale (0 under reduced motion) */
      --motion-scale: 1;
      --dur-state:  calc(200ms * var(--motion-scale));
      --dur-header: calc(250ms * var(--motion-scale));
    }

    @media (prefers-reduced-motion: reduce) {
      :root { --motion-scale: 0; }
    }

    /* ============================================================
       Reset
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      font-family: var(--font-sans);
      color: var(--color-text-body);
      background: var(--color-bg-hero);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; color: inherit; }
    button { background: none; border: 0; cursor: pointer; }
    ul { list-style: none; }

    .visually-hidden {
      position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    :focus-visible { outline: 2px solid var(--color-accent-teal); outline-offset: 3px; }

    /* Placeholder for an asset that hasn't been exported yet (see img/campaign/ASSETS.md).
       Swapped for the real file automatically once it exists. */
    .asset-ph {
      display: inline-block; flex: none; vertical-align: middle;
      width: var(--ph-size, 12px); height: var(--ph-size, 12px);
      background: #9a9aa6; border-radius: 2px;
    }
    .asset-ph--loaded { background: none; border-radius: 0; }
    .asset-ph--loaded img { width: 100%; height: 100%; }

    .container {
      width: 100%; max-width: var(--page-max);
      margin-inline: auto; padding-inline: var(--page-gutter);
    }

    /* ============================================================
       Page regions: stacking contract
       header (fixed, z 30) › content + footer (relative, z 10) › hero (sticky, z 0)
       ============================================================ */
    .site-header { position: fixed; inset: 0 0 auto; z-index: 30; }
    .hero {
      position: sticky; top: var(--hero-stick, 0px); z-index: 0;
      min-height: 100vh; min-height: 100svh;
      overflow: hidden; background: var(--color-bg-hero);
    }
    .content {
      position: relative; z-index: 10;
      background: var(--color-bg-content);
      border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
    }
    .site-footer { position: relative; z-index: 10; background: var(--color-bg-footer); }

    /* ============================================================
       Header
       ============================================================ */
    .site-header__inner {
      display: flex; align-items: center; justify-content: space-between;
      max-width: var(--page-max); margin-inline: auto; padding: var(--header-pad);
      pointer-events: none;           /* the empty band never blocks the page */
    }
    .site-header__inner > * { pointer-events: auto; }
    .site-header__logo { display: block; color: #dedede; transition: color var(--dur-header) ease; }
    .site-header__logo svg { width: 78.34px; height: 26.75px; }

    .site-nav ul {
      display: flex; align-items: center; gap: 40px;
      height: var(--nav-h); padding: 16px;
      background: var(--color-surface-overlay);
      border: 1px solid var(--color-border-nav);
      border-radius: var(--radius-nav);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      transition: background-color var(--dur-header) ease, border-color var(--dur-header) ease;
    }
    .site-nav a {
      display: flex; align-items: center; gap: 4px;
      font-family: var(--font-nav); font-size: var(--text-nav); line-height: 22px;
      color: var(--color-text-on-dark); white-space: nowrap;
      transition: color var(--dur-header) ease;
    }
    .site-nav a:hover { color: var(--color-accent-teal); }
    .site-nav__login { border-left: 1px solid var(--color-border-nav-divider); padding-inline: 16px; margin-right: -16px; transition: border-color var(--dur-header) ease; }

    .site-header__toggle {
      display: none; width: 40px; height: 40px; border-radius: 12px;
      background: var(--color-surface-overlay); border: 1px solid var(--color-border-nav);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      align-items: center; justify-content: center;
      transition: background-color var(--dur-header) ease, border-color var(--dur-header) ease;
    }
    .site-header__bars, .site-header__bars::before, .site-header__bars::after {
      display: block; width: 18px; height: 2px; border-radius: 1px;
      background: var(--color-text-on-dark); position: relative;
      transition: transform var(--dur-state) ease, background-color var(--dur-header) ease;
    }
    .site-header__bars::before, .site-header__bars::after { content: ""; position: absolute; left: 0; }
    .site-header__bars::before { top: -6px; }
    .site-header__bars::after  { top: 6px; }
    .site-header__toggle[aria-expanded="true"] .site-header__bars { background: transparent; }
    .site-header__toggle[aria-expanded="true"] .site-header__bars::before { transform: translateY(6px) rotate(45deg); }
    .site-header__toggle[aria-expanded="true"] .site-header__bars::after  { transform: translateY(-6px) rotate(-45deg); }

    /* ============================================================
       Hero
       ============================================================ */
    .hero__inner {
      position: relative;
      display: flex; flex-direction: column; align-items: center;
      padding: calc(134px + 60px) var(--page-gutter) 60px;
    }
    .hero__title {
      font-size: var(--text-display); font-weight: 600; line-height: 1.25;
      color: var(--color-text-hero-heading); text-align: center;
    }

    @media (max-width: 899px) {
      :root { --header-pad: 16px 20px; --page-gutter: 20px; }
      .site-header__toggle { display: inline-flex; }
      .site-nav {
        position: absolute; top: 64px; left: 20px; right: 20px;
        visibility: hidden; opacity: 0; transform: translateY(-6px);
        transition: opacity var(--dur-state) ease, transform var(--dur-state) ease, visibility 0s linear var(--dur-state);
      }
      .site-nav.is-open {
        visibility: visible; opacity: 1; transform: none;
        transition: opacity var(--dur-state) ease, transform var(--dur-state) ease;
      }
      .site-nav ul {
        flex-direction: column; align-items: stretch; gap: 0; height: auto; padding: 8px;
        background: rgba(4, 8, 34, 0.92);
      }
      .site-nav a { padding: 12px; justify-content: space-between; }
      .site-nav__login { border-left: 0; border-top: 1px solid var(--color-border-nav-divider); padding: 0; margin: 4px 0 0; }
    }
  </style>
</head>

  <footer class="site-footer">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script>
    /* Register plugins once. */
    gsap.registerPlugin(ScrollTrigger);

    /* ---------- Missing-asset placeholders: swap in the real file once it exists ---------- */
    document.querySelectorAll('.asset-ph[data-asset]').forEach((ph) => {
      const img = new Image();
      img.alt = '';
      img.onload = () => { ph.replaceChildren(img); ph.classList.add('asset-ph--loaded'); };
      img.src = `../img/campaign/${ph.dataset.asset}`;
    });

    /* ---------- Mobile nav toggle (CSS owns the open/closed state) ---------- */
    (() => {
      const toggle = document.querySelector('.site-header__toggle');
      const nav = document.getElementById('site-nav');
      const setOpen = (open) => {
        toggle.setAttribute('aria-expanded', String(open));
        nav.classList.toggle('is-open', open);
      };
      toggle.addEventListener('click', () => setOpen(toggle.getAttribute('aria-expanded') !== 'true'));
      nav.addEventListener('click', (e) => { if (e.target.closest('a')) setOpen(false); });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && nav.classList.contains('is-open')) { setOpen(false); toggle.focus(); }
      });
      matchMedia('(min-width: 900px)').addEventListener('change', () => setOpen(false));
    })();
  </script>
